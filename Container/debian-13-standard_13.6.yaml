# Pull: `docker import debian-13-standard_13.6-1_amd64.tar.txt debian13-local:latest`

version: '3.8'

services:
  debian-container:
    image: debian13-local:latest
    container_name: debian13_container
    stdin_open: true # Keeps the container stdin open (like -i)
    tty: true        # Allocates a pseudo-TTY (like -t)
    command: /bin/bash